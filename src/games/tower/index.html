<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tower</title>
<style>
  /* The palette is `render/feel.js`'s, in the same order. A test asserts the
     two agree, because a HUD that drifts from the world it labels is worse
     than one that never matched. */
  :root {
    --bg: #0b0f14;
    --panel: #1b2430;
    --good: #06d6a0;
    --warn: #ffb703;
    --bad: #ef476f;
    --info: #8ecae6;
    --ink: #dbe4ee;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 12px/1.4 var(--mono);
    overflow: hidden;
    /* A drag on the tower must pan it, not select the HUD text behind it. */
    user-select: none;
    -webkit-user-select: none;
  }

  #view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    /* The canvas is the world; its own art is scaled by integer zoom inside
       the renderer, so the element must never resample it again. */
    image-rendering: pixelated;
    touch-action: none;
    cursor: grab;
  }
  #view:active { cursor: grabbing; }

  /* ---------------------------------------------------------------- HUD  */

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 7px 12px;
    background: linear-gradient(var(--bg), rgba(11, 15, 20, 0.82) 70%, transparent);
    pointer-events: none;
    white-space: nowrap;
  }
  #hud > * { pointer-events: auto; }

  /* The readouts give up room first and the controls never do. A single flex
     row with `overflow: hidden` pushed the speed buttons off the right edge on
     a narrow window — and a clipped button is not a small cosmetic problem,
     it is the primary control of the game becoming unclickable with no
     symptom other than not being there. */
  #readouts {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1 1 auto;
    min-width: 0;
    /* Wrap, don't clip. The old `overflow: hidden` + ellipsis cut the goal and
       the let count to "300 mo…" and "0 …" at ~960px, hiding the very thing
       the player is steering by. A readout moves to a second row instead; the
       controls still never shrink. */
    flex-wrap: wrap;
    row-gap: 2px;
  }
  #readouts > * { flex: 0 0 auto; }
  #clock { flex-shrink: 0; }
  #cash, #pace, #speeds, #saved, #restart { flex: 0 0 auto; }

  /* Autosaving silently is not reassuring — a save you cannot see is a save you
     cannot trust. This is deliberately quiet and deliberately present. */
  #saved { color: #56687d; font-size: 11px; }

  #restart {
    font: 600 11px var(--mono);
    color: #56687d;
    background: none;
    border: 1px solid #2c3948;
    border-radius: 3px;
    padding: 3px 8px;
    cursor: pointer;
  }
  #restart:hover { color: var(--ink); border-color: #3d4d60; }
  /* Armed. Losing an hour to a misclick is the failure saving exists to
     prevent, so the button asks once — and it asks in the colour of the thing
     it is about to do. */
  #restart.armed { color: var(--bg); background: var(--bad); border-color: var(--bad); }

  #clock { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
  #day { color: var(--info); font-weight: 700; }
  #daypart, #tick, #pace { color: #7d8b9c; }
  /* inline-block, or `transform` on the bump below silently does nothing. */
  #leases { color: var(--warn); font-weight: 700; display: inline-block; }

  /* The HUD's half of the rent moment. An office renting is the event this
     whole rebuild exists to show, so the counter that tracks it does not get to
     change silently — it jumps, and it takes the colour of the direction it
     moved. Green up, red down; the two must never look alike. */
  #leases.bump { animation: bump 620ms ease-out; }
  #leases.bump.up { color: var(--good); }
  #leases.bump.down { color: var(--bad); }
  @keyframes bump {
    0%   { transform: scale(1);    }
    18%  { transform: scale(1.35); }
    100% { transform: scale(1);    }
  }
  /* Somebody reading this on a machine set to reduce motion still needs to know
     the number moved, so the colour stays and only the jump goes. */
  @media (prefers-reduced-motion: reduce) {
    #leases.bump { animation: none; }
  }
  /* The goal. `CLAUDE.md`'s no-sidebar rule holds: one glyph and one clause,
     on the bar with everything else. The stars are the state, the clause is the
     only part a player can act on, so the clause gets the readable colour and
     the stars stay quiet. */
  #stars { color: var(--warn); letter-spacing: -1px; flex-shrink: 0; display: inline-block; }
  /* The goal says EVERYTHING missing for the next rung (issue #14), which is a sentence
     and not a number: it takes the row under the readouts and wraps there, instead of
     pushing the lease count and the stress off the bar. */
  #goal { color: #9fb3c8; order: 1; flex: 1 1 100%; white-space: normal; line-height: 1.35; }
  /* A rung climbed. Same rule as the lease counter's bump: the timer in `main.js` resets it. */
  #stars.rise { animation: rise 1500ms ease-out; color: var(--good); }
  @keyframes rise {
    0%   { transform: scale(1); }
    15%  { transform: scale(1.6); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    #stars.rise { animation: none; }
  }
  /* What the tower is demanding back. Warm, because it is a request and not an error. */
  #demands { color: var(--warn); font-weight: 700; }

  #waiting { color: var(--info); }
  #cash { color: var(--good); font-weight: 700; }

  #speeds { display: flex; gap: 3px; }
  #speeds button {
    font: 700 11px var(--mono);
    color: #7d8b9c;
    background: var(--panel);
    border: 1px solid #2c3948;
    border-radius: 3px;
    padding: 3px 9px;
    cursor: pointer;
  }
  #speeds button:hover { color: var(--ink); }
  #speeds button.on { color: var(--bg); background: var(--info); border-color: var(--info); }

  /* ------------------------------------------------------------- palette */

  #palette {
    position: absolute;
    left: 12px;
    top: 92px;
    /* Scroll rather than run into the footer: the palette grows with every
       family the sim learns to build (twenty-odd by the end). */
    max-height: calc(100% - 92px - 56px);
    overflow-y: auto;
    scrollbar-width: thin;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #palette button b:empty { display: none; }
  #palette button {
    display: flex;
    align-items: baseline;
    gap: 7px;
    min-width: 108px;
    font: 600 11px var(--mono);
    text-align: left;
    color: #9fb3c8;
    background: rgba(27, 36, 48, 0.92);
    border: 1px solid #2c3948;
    border-radius: 3px;
    padding: 6px 9px;
    cursor: pointer;
  }
  #palette button b { color: #56687d; font-weight: 700; }
  #palette button:hover { color: var(--ink); border-color: #3d4d60; }
  /* The held tool has to be obvious from across the screen — a modal cursor
     whose mode is not visible is how you place an office you did not mean to. */
  #palette button.on {
    color: var(--bg);
    background: var(--info);
    border-color: var(--info);
  }
  #palette button.on b { color: rgba(11, 15, 20, 0.55); }

  /* ------------------------------------------------------ lift control panel */

  #liftpanel, #theaterpanel {
    position: absolute;
    left: 140px; top: 92px;
    width: 410px;
    max-height: calc(100% - 92px - 56px);
    overflow-y: auto;
    padding: 10px 12px;
    background: rgba(18, 24, 32, 0.96);
    border: 1px solid #2c3948;
    border-radius: 4px;
    font: 600 11px var(--mono);
    color: #9fb3c8;
  }
  #liftpanel[hidden], #theaterpanel[hidden], #eventdialog[hidden], #finale[hidden] { display: none; }

  /* ------------------------------ the windows and map views (issue #18) */

  /* The Finance, Facility and Tenant windows are the lift panel's cousins: the same panel, the same
     buttons, the same place. They are never open together, and each one holds the clock while it is. */
  #financewindow, #facilitywindow, #tenantwindow {
    position: absolute;
    left: 140px; top: 92px;
    width: 410px;
    max-width: calc(100% - 152px);
    max-height: calc(100% - 92px - 56px);
    overflow-y: auto;
    padding: 10px 12px;
    background: rgba(18, 24, 32, 0.96);
    border: 1px solid #2c3948;
    border-radius: 4px;
    font: 600 11px var(--mono);
    color: #9fb3c8;
    user-select: text;
  }
  #financewindow[hidden], #facilitywindow[hidden], #tenantwindow[hidden], #viewkey[hidden] { display: none; }
  #financewindow button, #facilitywindow button, #tenantwindow button {
    font: inherit; color: inherit; cursor: pointer;
    background: #1b2430; border: 1px solid #2c3948; border-radius: 3px; padding: 3px 6px;
  }
  #financewindow button:hover:not(:disabled), #facilitywindow button:hover:not(:disabled), #tenantwindow button:hover:not(:disabled) {
    color: var(--ink); border-color: #3d4d60;
  }
  #financewindow button:disabled, #facilitywindow button:disabled, #tenantwindow button:disabled { opacity: 0.45; cursor: default; }
  /* A narrow screen gets the whole width: the palette is behind the window while it is open and is
     back the moment it closes (Escape, the cross, or pressing Edit). */
  @media (max-width: 560px) {
    #financewindow, #facilitywindow, #tenantwindow { left: 12px; right: 12px; width: auto; max-width: none; top: 120px; max-height: calc(100% - 120px - 56px); }
  }

  .fw-sub { color: #7d8b9c; margin-bottom: 8px; }
  .fw-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .fw-tab.on { color: var(--bg) !important; background: var(--info) !important; border-color: var(--info) !important; }
  .fw-row { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; color: var(--ink); }
  .fw-row.neg span:last-child { color: var(--bad); }
  .fw-row.fw-none { color: #56687d; }
  .fw-row.fw-total { border-top: 1px solid #2c3948; margin-top: 2px; padding-top: 3px; color: #9fb3c8; }
  .fw-row.fw-net { border-top: 2px solid #3d4d60; margin-top: 8px; padding-top: 4px; font-size: 13px; }
  .fw-row.fw-net span:last-child { color: var(--good); }
  .fw-row.fw-net.neg span:last-child { color: var(--bad); }
  .fw-row.fw-base { color: #7d8b9c; }

  .fw-evalrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .fw-bar { position: relative; flex: 1 1 auto; height: 12px; background: #0f151c; border: 1px solid #2c3948; border-radius: 2px; min-width: 90px; }
  .fw-fill { position: absolute; left: 0; top: 0; bottom: 0; display: block; }
  .fw-div { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.8; }
  .fw-evalword { white-space: nowrap; }
  .fw-reason { color: var(--warn); margin-top: 3px; }
  .fw-good { color: var(--good); margin-top: 3px; }
  .fw-tiers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .fw-tier { display: flex !important; flex-direction: column; align-items: center; gap: 1px; padding: 5px 2px !important; }
  .fw-tier.on { color: var(--bg) !important; background: var(--info) !important; border-color: var(--info) !important; }
  .fw-tier small { font-size: 9px; opacity: 0.8; }
  .fw-people { display: flex; flex-direction: column; gap: 3px; }
  .fw-person { display: grid !important; grid-template-columns: 28px 1fr auto; gap: 6px; text-align: left; }
  .fw-found { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
  .fw-name {
    flex: 1 1 auto; min-width: 0;
    font: inherit; color: var(--ink); background: #0f151c; border: 1px solid #2c3948; border-radius: 3px; padding: 4px 6px;
    user-select: text; -webkit-user-select: text;
  }

  /* The map bar: Edit / Eval / Pricing / Hotel / Finance, under the HUD at the right, left of the minimap strip (which is 40px wide plus its margin). */
  #mapbar { position: absolute; top: 92px; right: 68px; display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 52%; }
  #mapbar button {
    font: 700 11px var(--mono); color: #7d8b9c; background: rgba(27, 36, 48, 0.92);
    border: 1px solid #2c3948; border-radius: 3px; padding: 4px 9px; cursor: pointer;
  }
  #mapbar button:hover:not(:disabled) { color: var(--ink); }
  #mapbar button:disabled { opacity: 0.4; cursor: default; }
  #mapbar button.on { color: var(--bg); background: var(--info); border-color: var(--info); }
  /* What the colours mean, while a view is on. */
  #viewkey {
    position: absolute; top: 126px; right: 68px; display: flex; flex-direction: column; gap: 3px;
    padding: 8px 10px; background: rgba(18, 24, 32, 0.94); border: 1px solid #2c3948; border-radius: 4px;
    font: 600 11px var(--mono); color: #9fb3c8; pointer-events: none;
  }
  #viewkey b { color: var(--ink); margin-bottom: 2px; }
  #viewkey i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }

  /* ----------------------------------------- the Tower rank (issue #17) */

  #finale {
    /* Low on the screen, so the fireworks over the cathedral's roof are not behind it. */
    position: absolute;
    left: 50%; bottom: 64px;
    transform: translateX(-50%);
    width: 420px; max-width: calc(100% - 24px);
    padding: 16px 18px;
    text-align: center;
    background: rgba(18, 24, 32, 0.96);
    border: 2px solid #ffcf40;
    border-radius: 4px;
    font: 600 12px var(--mono);
    color: #c3d0de;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), 0 0 28px rgba(255, 207, 64, 0.25);
  }
  #finale .fin-rank { color: #ffcf40; font-size: 26px; letter-spacing: 0.4em; margin-bottom: 6px; }
  #finale .fin-title { color: var(--ink); font-size: 15px; }
  #finale .fin-line { margin-top: 4px; color: var(--ink); }
  #finale .fin-facts { margin-top: 12px; color: #9fb3c8; }
  #finale .fin-note { margin-top: 6px; color: #7d8b9c; }
  #finale .fin-btn {
    margin-top: 14px; font: inherit; color: var(--ink); cursor: pointer;
    background: #1b2430; border: 1px solid #ffcf40; border-radius: 3px; padding: 8px 18px;
  }
  #finale .fin-btn:hover { background: #26303e; }

  /* ---------------------------------------------- the tower asks (issue #16) */

  #eventdialog {
    position: absolute;
    left: 50%; top: 22%;
    transform: translateX(-50%);
    width: 440px; max-width: calc(100% - 24px);
    padding: 14px 16px;
    background: rgba(18, 24, 32, 0.98);
    border: 2px solid var(--bad);
    border-radius: 4px;
    font: 600 12px var(--mono);
    color: #c3d0de;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
    user-select: text;
  }
  #eventdialog .ev-title { color: var(--bad); font-size: 15px; margin-bottom: 8px; }
  #eventdialog .ev-line { margin-top: 4px; }
  #eventdialog .ev-buttons { display: flex; gap: 10px; margin-top: 14px; }
  #eventdialog .ev-btn {
    flex: 1; font: inherit; color: var(--ink); cursor: pointer;
    background: #1b2430; border: 1px solid #3d4d60; border-radius: 3px; padding: 8px 10px;
  }
  #eventdialog .ev-btn:hover:not(:disabled) { border-color: var(--info); }
  #eventdialog .ev-btn:disabled { opacity: 0.45; cursor: default; }
  #eventdialog .ev-status { min-height: 1.4em; }
  #theaterpanel { width: 380px; }
  .tp-film { color: var(--ink); font-size: 13px; margin-bottom: 6px; }
  .tp-line { margin-top: 4px; }
  .tp-buys { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .tp-buy { text-align: left; }
  .tp-buy.poor { color: #56687d; }
  #liftpanel button, #theaterpanel button {
    font: inherit; color: inherit; cursor: pointer;
    background: #1b2430; border: 1px solid #2c3948; border-radius: 3px; padding: 3px 6px;
  }
  #liftpanel button:hover:not(:disabled), #theaterpanel button:hover:not(:disabled) { color: var(--ink); border-color: #3d4d60; }
  #liftpanel button:disabled, #theaterpanel button:disabled { opacity: 0.45; cursor: default; }
  .lp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: var(--ink); }
  .lp-grid { display: grid; grid-template-columns: 52px repeat(7, 1fr); gap: 3px; align-items: center; }
  .lp-col { font-size: 9px; color: #56687d; text-align: center; }
  .lp-row { font-size: 10px; color: #7d8b9c; }
  .lp-cell.m1 { color: var(--bg); background: var(--info); border-color: var(--info); }
  .lp-cell.m2 { color: var(--bg); background: var(--warn); border-color: var(--warn); }
  .lp-cell small { opacity: 0.7; }
  .lp-line, .lp-cars { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .lp-label { margin: 10px 0 4px; font-size: 10px; color: #56687d; }
  .lp-stops { display: flex; flex-wrap: wrap; gap: 3px; }
  .lp-stop.off { text-decoration: line-through; color: #56687d; }
  .lp-status { margin-top: 8px; color: var(--bad); }

  /* -------------------------------------------------------------- footer */

  #foot {
    position: absolute;
    left: 12px; bottom: 10px;
    display: flex;
    gap: 16px;
    align-items: baseline;
    color: #7d8b9c;
    pointer-events: none;
  }
  #hover { color: var(--ink); min-width: 24ch; }
  /* What just happened, or why it did not. A refusal is an answer and it has
     to be readable at a glance, so it takes the same red as everything else
     that means "no". */
  #events { color: var(--bad); font-weight: 700; }
  #answer { color: var(--good); font-weight: 700; min-width: 20ch; }
  #answer.bad { color: var(--bad); }
  #keys { font-size: 11px; }

  #legend { display: flex; gap: 10px; align-items: center; }
  #legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  /* The three stress bands, `specs/PEOPLE.md` § Stress Color Bands. Same three
     values `render/canvas.js` exports as STRESS_COLORS. */
  .s-black i { background: #9fb3c8; }
  .s-pink  i { background: #ff9ecd; }
  .s-red   i { background: #ef476f; }

  /* An exception in a frame or a listener looks exactly like nothing
     happening. This makes it look like a failure. */
  #failure {
    position: absolute;
    left: 12px; right: 12px; top: 44px;
    padding: 7px 10px;
    background: var(--bad);
    color: #14090d;
    font-weight: 700;
    border-radius: 3px;
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud">
    <span id="readouts">
      <span id="clock">—</span>
      <span id="day">day 0</span>
      <span id="daypart">—</span>
      <span id="tick">t0000</span>
      <span id="stars" title="tower activity">☆☆☆☆☆</span>
      <span id="goal"></span>
      <span id="leases">0/0 let</span>
      <span id="stress">no trips yet</span>
      <span id="waiting">0 waiting</span>
      <span id="hotels" hidden title="hotel rooms waiting to be cleaned, and rooms lost to cockroaches"></span>
      <span id="events" hidden title="a bomb, a fire or a VIP in the tower right now"></span>
      <span id="demands" hidden title="what the tower is asking for - build it and the notice goes away"></span>
      <span id="people">—</span>
    </span>
    <span id="cash">—</span>
    <span id="saved"></span>
    <button id="restart" title="throw this tower away and start a new one">New tower</button>
    <span id="pace">—</span>
    <span id="speeds">
      <button data-speed="0" title="pause (space or q)">||</button>
      <button data-speed="1" title="1x (w)">1&times;</button>
      <button data-speed="2" title="2x (e)">2&times;</button>
      <button data-speed="4" title="4x (r)">4&times;</button>
    </span>
  </div>

  <div id="failure" hidden></div>

  <!-- The map views and the Finance window (issue #18), built by ui/main.js from ui/overlays.js `mapBarModel`. -->
  <div id="mapbar" role="toolbar" aria-label="map views"></div>
  <div id="viewkey" hidden></div>

  <!-- The palette. Buttons are generated from the sim's own BUILDABLE and
       SHAFT_KIND, so this stays empty in the markup on purpose: a hand-written
       list here would be a second place to remember. -->
  <div id="palette"></div>

  <!-- The elevator control panel. Filled by ui/lift-panel.js when a shaft is
       clicked with no tool in hand. -->
  <div id="liftpanel" hidden></div>

  <!-- The theater window (issue #11). Filled by ui/theater-panel.js when a theater
       is clicked with no tool in hand. -->
  <div id="theaterpanel" hidden></div>

  <!-- The Finance, Facility and Tenant windows (issue #18). Filled by ui/finance-window.js,
       ui/facility-window.js and ui/tenant-window.js; each holds the clock while it is open. -->
  <div id="financewindow" hidden></div>
  <div id="facilitywindow" hidden></div>
  <div id="tenantwindow" hidden></div>

  <!-- The question a bomb or a fire asks (issue #16). Filled by ui/event-dialog.js while the
       sim has one open; the game does not run until it is answered. -->
  <div id="eventdialog" hidden></div>

  <!-- The Tower rank (issue #17). Filled by ui/finale.js when the rank is earned while the page
       is open; the game keeps running behind it. -->
  <div id="finale" hidden></div>

  <div id="foot">
    <span id="answer"></span>
    <span id="hover"></span>
    <span id="legend">
      <span class="s-black"><i></i>calm</span>
      <span class="s-pink"><i></i>stressed</span>
      <span class="s-red"><i></i>fed up</span>
    </span>
    <span id="keys">1-7 tool &middot; click build &middot; esc cancel &middot; drag pan &middot; wheel zoom &middot; space pause &middot; qwer speed</span>
  </div>

  <script type="module" src="./ui/main.js"></script>
</body>
</html>
